# Checks the frozen release candidate: the exact archive committed under
# candidate/, not a fresh build of the checkout. One job verifies it against
# candidate/CANDIDATE and the commit it was built from, then uploads that file;
# every cell of the R-CMD-check.yaml matrix tests those bytes. The browser
# screenshots stay in js-tests.yaml, whose baselines are Windows Chromium only.
on:
  push:
    branches: [main, master]
    paths:
      - 'candidate/**'
      - 'tools/candidate.mjs'
      - 'tools/run-candidate.mjs'
      - 'tools/smoke-installed.R'
      - '.github/workflows/candidate-check.yaml'
  pull_request:
    paths:
      - 'candidate/**'
      - 'tools/candidate.mjs'
      - 'tools/run-candidate.mjs'
      - 'tools/smoke-installed.R'
      - '.github/workflows/candidate-check.yaml'
  workflow_dispatch:

name: candidate-check.yaml

permissions: read-all

jobs:
  verify:
    runs-on: ubuntu-latest
    name: archive matches its record and commit
    timeout-minutes: 10

    steps:
      # The record's commit precedes the commit that adds the archive.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: node tools/run-candidate.mjs verify

      - uses: actions/upload-artifact@v7
        with:
          name: candidate
          path: candidate/shadshiny_*.tar.gz
          if-no-files-found: error
          compression-level: 0

  check:
    needs: verify
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: '4.1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # check-r-package sets these two the same way
      _R_CHECK_FORCE_SUGGESTS_: false
      _R_CHECK_CRAN_INCOMING_: false

    defaults:
      run:
        shell: bash

    steps:
      # The checkout supplies candidate/CANDIDATE and tools/ only; the package
      # comes from the uploaded archive.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: candidate
          path: candidate-artifact

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: downloaded archive matches the record
        run: node tools/run-candidate.mjs verify --hash-only --archive candidate-artifact/shadshiny_*.tar.gz

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Dependencies come from the archive's DESCRIPTION, not the checkout's.
      - name: unpack the archive's DESCRIPTION
        shell: Rscript {0}
        run: |
          untar(Sys.glob("candidate-artifact/shadshiny_*.tar.gz"),
                files = "shadshiny/DESCRIPTION", exdir = "candidate-src")

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: candidate-src/shadshiny
          extra-packages: any::rcmdcheck
          needs: check

      - name: install into an empty library and smoke-test it
        run: |
          mkdir candidate-lib
          R CMD INSTALL --library=candidate-lib candidate-artifact/shadshiny_*.tar.gz
          Rscript tools/smoke-installed.R candidate-lib candidate-artifact/shadshiny_*.tar.gz

      - name: R CMD check the archive
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            Sys.glob("candidate-artifact/shadshiny_*.tar.gz"),
            args = c("--no-manual", "--as-cran"),
            error_on = "warning",
            check_dir = "check"
          )

      - name: Show testthat output
        if: always()
        run: find check -name 'testthat.Rout*' -exec cat '{}' \; || true

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-check-${{ matrix.config.os }}-r${{ matrix.config.r }}
          path: check
