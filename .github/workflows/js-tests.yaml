# Unit tests for the browser assets (inst/assets). Node is a development
# dependency only — installing or using the R package never needs it.
on:
  push:
    branches: [main, master]
    paths:
      - 'inst/assets/**'
      - 'tests/js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.js'
      - '.github/workflows/js-tests.yaml'
  pull_request:
    paths:
      - 'inst/assets/**'
      - 'tests/js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.js'
      - '.github/workflows/js-tests.yaml'

name: js-tests.yaml

permissions: read-all

jobs:
  vitest:
    runs-on: ubuntu-latest
    name: vitest (node ${{ matrix.node }})

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test
