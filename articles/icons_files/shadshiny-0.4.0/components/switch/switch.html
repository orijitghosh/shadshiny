<!-- FILE: inst/assets/components/switch/switch.html -->
<div class="shad-switch-row">
  <button type="button" class="shad-switch" data-shad="switch" role="switch" data-state="unchecked" id="sw-air">
    <span class="shad-switch__thumb" aria-hidden="true"></span>
  </button>
  <label class="shad-label" for="sw-air">Airplane Mode</label>
</div>

<div class="shad-switch-row">
  <button type="button" class="shad-switch" data-shad="switch" role="switch" data-state="checked" id="sw-wifi">
    <span class="shad-switch__thumb" aria-hidden="true"></span>
  </button>
  <label class="shad-label" for="sw-wifi">Wi-Fi</label>
</div>

<div class="shad-switch-row">
  <button type="button" class="shad-switch" data-shad="switch" role="switch" data-state="unchecked" data-disabled disabled id="sw-dis">
    <span class="shad-switch__thumb" aria-hidden="true"></span>
  </button>
  <label class="shad-label" data-disabled for="sw-dis">Disabled</label>
</div>
