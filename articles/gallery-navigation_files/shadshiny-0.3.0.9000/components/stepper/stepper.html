<!DOCTYPE html>
<!-- FILE: inst/assets/components/stepper/stepper.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shadshiny — stepper</title>
<link rel="stylesheet" href="../../tokens/shad-tokens.css">
<link rel="stylesheet" href="../../core/shad-base.css">
<link rel="stylesheet" href="../button/button.css">
<link rel="stylesheet" href="stepper.css">
<style>body { margin: 2rem; background: var(--shad-background); } .demo { max-width: 44rem; margin: 0 auto 3rem; } .demo h2 { font-family: var(--shad-font-sans); color: var(--shad-foreground); font-size: var(--shad-text-lg); } .row { display: flex; gap: 0.5rem; margin-top: 1rem; }</style>
</head>
<body>
<div class="demo">
  <h2>Horizontal, clickable, with panels</h2>
  <div id="st1" data-shad="stepper" class="shad-stepper" data-orientation="horizontal" data-clickable data-active="1">
    <ol class="shad-stepper__list">
      <li class="shad-stepper__item">
        <button type="button" class="shad-stepper__trigger">
          <span class="shad-stepper__indicator"><span class="shad-stepper__number">1</span><svg class="shad-stepper__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 7" pathLength="1"/></svg><svg class="shad-stepper__x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
          <span class="shad-stepper__meta"><span class="shad-stepper__label">Account</span><span class="shad-stepper__description">Email + password</span></span>
        </button>
        <span class="shad-stepper__connector" aria-hidden="true"></span>
      </li>
      <li class="shad-stepper__item">
        <button type="button" class="shad-stepper__trigger">
          <span class="shad-stepper__indicator"><span class="shad-stepper__number">2</span><svg class="shad-stepper__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 7" pathLength="1"/></svg><svg class="shad-stepper__x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
          <span class="shad-stepper__meta"><span class="shad-stepper__label">Profile</span><span class="shad-stepper__description">Name + avatar</span></span>
        </button>
        <span class="shad-stepper__connector" aria-hidden="true"></span>
      </li>
      <li class="shad-stepper__item">
        <button type="button" class="shad-stepper__trigger">
          <span class="shad-stepper__indicator"><span class="shad-stepper__number">3</span><svg class="shad-stepper__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 7" pathLength="1"/></svg><svg class="shad-stepper__x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
          <span class="shad-stepper__meta"><span class="shad-stepper__label">Review</span></span>
        </button>
      </li>
    </ol>
    <div class="shad-stepper__panels">
      <div class="shad-stepper__panel">Step 1 content — account form.</div>
      <div class="shad-stepper__panel">Step 2 content — profile form.</div>
      <div class="shad-stepper__panel">Step 3 content — review and submit.</div>
    </div>
  </div>
  <div class="row">
    <button type="button" class="shad-btn shad-btn--outline shad-btn--sm" id="prevBtn">Back</button>
    <button type="button" class="shad-btn shad-btn--default shad-btn--sm" id="nextBtn">Next</button>
  </div>
</div>

<div class="demo">
  <h2>Vertical, linear, with an error state</h2>
  <div id="st2" data-shad="stepper" class="shad-stepper" data-orientation="vertical" data-linear data-clickable data-active="2">
    <ol class="shad-stepper__list">
      <li class="shad-stepper__item">
        <button type="button" class="shad-stepper__trigger">
          <span class="shad-stepper__indicator"><span class="shad-stepper__number">1</span><svg class="shad-stepper__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 7" pathLength="1"/></svg><svg class="shad-stepper__x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
          <span class="shad-stepper__meta"><span class="shad-stepper__label">Upload data</span></span>
        </button>
        <span class="shad-stepper__connector" aria-hidden="true"></span>
      </li>
      <li class="shad-stepper__item" data-state="error">
        <button type="button" class="shad-stepper__trigger">
          <span class="shad-stepper__indicator"><span class="shad-stepper__number">2</span><svg class="shad-stepper__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 7" pathLength="1"/></svg><svg class="shad-stepper__x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
          <span class="shad-stepper__meta"><span class="shad-stepper__label">Validate</span><span class="shad-stepper__description">3 rows failed</span></span>
        </button>
        <span class="shad-stepper__connector" aria-hidden="true"></span>
      </li>
      <li class="shad-stepper__item">
        <button type="button" class="shad-stepper__trigger">
          <span class="shad-stepper__indicator"><span class="shad-stepper__number">3</span><svg class="shad-stepper__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 7" pathLength="1"/></svg><svg class="shad-stepper__x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
          <span class="shad-stepper__meta"><span class="shad-stepper__label">Import</span></span>
        </button>
      </li>
    </ol>
  </div>
</div>

<script src="../../core/shad-runtime.js"></script>
<script src="stepper.js"></script>
<script>
shad.autoInit();
var st1 = shad.get(document.getElementById("st1"));
document.getElementById("nextBtn").addEventListener("click", function () { st1.next(); });
document.getElementById("prevBtn").addEventListener("click", function () { st1.prev(); });
document.getElementById("st1").addEventListener("shad:change", function (e) { console.log("step:", e.detail.value); });
</script>
</body>
</html>
