<div class="shad-dialog" data-shad="alert-dialog">
  <button type="button" class="shad-btn shad-btn--destructive shad-dialog__trigger">Delete account</button>
  <div class="shad-dialog__overlay shad-anim-overlay" hidden></div>
  <div class="shad-dialog__content shad-anim-dialog" hidden>
    <div class="shad-dialog__header">
      <div class="shad-dialog__title">Are you absolutely sure?</div>
      <div class="shad-dialog__description">This action cannot be undone. This will permanently delete your account and remove your data from our servers.</div>
    </div>
    <div class="shad-dialog__footer">
      <button type="button" class="shad-btn shad-btn--outline" data-shad-dialog-close data-shad-autofocus>Cancel</button>
      <button type="button" class="shad-btn shad-btn--destructive" data-shad-dialog-close>Continue</button>
    </div>
  </div>
</div>
