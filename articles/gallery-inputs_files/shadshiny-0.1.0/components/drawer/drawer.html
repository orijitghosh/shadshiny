<!-- FILE: inst/assets/components/drawer/drawer.html -->
<div data-shad="drawer">
  <button type="button" class="shad-btn shad-btn--outline shad-drawer__trigger">Open drawer</button>
  <div class="shad-drawer__overlay shad-anim-overlay" hidden></div>
  <div class="shad-drawer__content shad-anim-sheet" hidden>
    <div class="shad-drawer__handle" aria-hidden="true"></div>
    <div class="shad-drawer__header">
      <div class="shad-drawer__title">Move Goal</div>
      <div class="shad-drawer__description">Set your daily activity goal.</div>
    </div>
    <div class="shad-drawer__body">
      <p class="shad-muted">Drag the handle down to dismiss, or use the buttons.</p>
    </div>
    <div class="shad-drawer__footer">
      <button type="button" class="shad-btn shad-btn--default" data-shad-drawer-close>Submit</button>
      <button type="button" class="shad-btn shad-btn--outline" data-shad-drawer-close>Cancel</button>
    </div>
  </div>
</div>
