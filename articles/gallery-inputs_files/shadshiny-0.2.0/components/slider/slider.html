<!-- FILE: inst/assets/components/slider/slider.html -->
<!-- single -->
<div class="shad-slider" data-shad="slider" data-min="0" data-max="100" data-step="1" data-value="50" style="max-width: 20rem;">
  <div class="shad-slider__track"><div class="shad-slider__range"></div></div>
  <div class="shad-slider__thumb" role="slider" tabindex="0" aria-label="Volume"></div>
</div>

<!-- range (two thumbs) -->
<div class="shad-slider" data-shad="slider" data-min="0" data-max="100" data-step="5" data-value="25" data-value2="75" style="max-width: 20rem;">
  <div class="shad-slider__track"><div class="shad-slider__range"></div></div>
  <div class="shad-slider__thumb" role="slider" tabindex="0" aria-label="Minimum price"></div>
  <div class="shad-slider__thumb" role="slider" tabindex="0" aria-label="Maximum price"></div>
</div>

<!-- with marks + labels -->
<div class="shad-slider" data-shad="slider" data-min="0" data-max="100" data-step="25" data-value="50" data-marks="0,25,50,75,100" data-marks-labels style="max-width: 20rem; margin-bottom: 1.5rem;">
  <div class="shad-slider__track"><div class="shad-slider__range"></div></div>
  <div class="shad-slider__thumb" role="slider" tabindex="0" aria-label="Quality"></div>
</div>

<!-- disabled -->
<div class="shad-slider" data-shad="slider" data-disabled data-min="0" data-max="100" data-step="1" data-value="30" style="max-width: 20rem;">
  <div class="shad-slider__track"><div class="shad-slider__range"></div></div>
  <div class="shad-slider__thumb" role="slider" tabindex="-1" aria-label="Disabled"></div>
</div>
