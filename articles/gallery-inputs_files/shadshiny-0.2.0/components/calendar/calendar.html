<!-- FILE: inst/assets/components/calendar/calendar.html -->
<!-- single-select; grid rendered by JS -->
<div class="shad-calendar" data-shad="calendar" data-mode="single" data-value="2026-07-11"></div>

<!-- range-select, Monday week start, bounded -->
<div class="shad-calendar" data-shad="calendar" data-mode="range"
     data-value="2026-07-06" data-value-end="2026-07-10"
     data-week-start="1" data-min="2026-01-01" data-max="2026-12-31"></div>

<!-- empty single -->
<div class="shad-calendar" data-shad="calendar" data-mode="single"></div>

<!-- month + year dropdowns, e.g. a date of birth -->
<div class="shad-calendar" data-shad="calendar" data-mode="single"
     data-caption-layout="dropdown" data-month="1993-06"
     data-from-year="1900" data-to-year="2026"></div>
