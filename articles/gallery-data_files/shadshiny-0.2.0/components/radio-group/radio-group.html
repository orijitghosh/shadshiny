<!-- FILE: inst/assets/components/radio-group/radio-group.html -->
<div class="shad-radio-group" data-shad="radio-group" role="radiogroup" aria-label="Notification level">
  <div class="shad-radio-row">
    <button type="button" class="shad-radio" role="radio" data-value="default" data-state="checked" id="r1">
      <span class="shad-radio__indicator" aria-hidden="true"></span>
    </button>
    <label class="shad-label" for="r1">Default</label>
  </div>
  <div class="shad-radio-row">
    <button type="button" class="shad-radio" role="radio" data-value="comfortable" data-state="unchecked" id="r2">
      <span class="shad-radio__indicator" aria-hidden="true"></span>
    </button>
    <label class="shad-label" for="r2">Comfortable</label>
  </div>
  <div class="shad-radio-row">
    <button type="button" class="shad-radio" role="radio" data-value="compact" data-state="unchecked" id="r3">
      <span class="shad-radio__indicator" aria-hidden="true"></span>
    </button>
    <label class="shad-label" for="r3">Compact</label>
  </div>
  <div class="shad-radio-row">
    <button type="button" class="shad-radio" role="radio" data-value="off" data-state="unchecked" data-disabled disabled id="r4">
      <span class="shad-radio__indicator" aria-hidden="true"></span>
    </button>
    <label class="shad-label" data-disabled for="r4">Off (disabled)</label>
  </div>
</div>

<!-- horizontal -->
<div class="shad-radio-group" data-shad="radio-group" data-orientation="horizontal" role="radiogroup" aria-label="Plan">
  <div class="shad-radio-row">
    <button type="button" class="shad-radio" role="radio" data-value="free" data-state="unchecked" id="rp1"><span class="shad-radio__indicator" aria-hidden="true"></span></button>
    <label class="shad-label" for="rp1">Free</label>
  </div>
  <div class="shad-radio-row">
    <button type="button" class="shad-radio" role="radio" data-value="pro" data-state="checked" id="rp2"><span class="shad-radio__indicator" aria-hidden="true"></span></button>
    <label class="shad-label" for="rp2">Pro</label>
  </div>
</div>
