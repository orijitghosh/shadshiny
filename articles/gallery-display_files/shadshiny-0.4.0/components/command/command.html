<!-- Inline palette -->

        Calendar

      <button type="button" class="shad-command__item" data-value="search-emoji">
        <svg class="shad-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>

        Calculator

    <div class="shad-command__separator"></div>
    <div class="shad-command__group">
      <div class="shad-command__group-heading">Settings</div>

        Profile <span class="shad-command__shortcut">⌘P</span>
      </button>
      <button type="button" class="shad-command__item" data-value="billing">
        Billing <span class="shad-command__shortcut">⌘B</span>
      </button>
      <button type="button" class="shad-command__item" data-value="settings">
        Settings <span class="shad-command__shortcut">⌘S</span>
      </button>
    </div>
  </div>
</div>

<!-- Dialog palette: hidden until ⌘K / Ctrl+K (or instance.open()) -->

    <svg class="shad-command__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>

</div>
