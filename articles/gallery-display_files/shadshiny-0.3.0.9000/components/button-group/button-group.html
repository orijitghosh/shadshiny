<!-- FILE: inst/assets/components/button-group/button-group.html -->
<!-- horizontal segmented control -->
<div class="shad-button-group" role="group" data-orientation="horizontal" aria-label="Text alignment">
  <button type="button" class="shad-btn shad-btn--outline">Left</button>
  <button type="button" class="shad-btn shad-btn--outline">Center</button>
  <button type="button" class="shad-btn shad-btn--outline">Right</button>
</div>

<!-- with a leading text segment -->
<div class="shad-button-group" role="group" data-orientation="horizontal">
  <span class="shad-button-group__text">https://</span>
  <button type="button" class="shad-btn shad-btn--outline">example.com</button>
  <div class="shad-button-group__separator" role="separator"></div>
  <button type="button" class="shad-btn shad-btn--outline">Copy</button>
</div>

<!-- vertical -->
<div class="shad-button-group" role="group" data-orientation="vertical" aria-label="Zoom">
  <button type="button" class="shad-btn shad-btn--outline">Zoom in</button>
  <button type="button" class="shad-btn shad-btn--outline">Reset</button>
  <button type="button" class="shad-btn shad-btn--outline">Zoom out</button>
</div>
