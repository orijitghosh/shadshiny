url: https://orijitghosh.github.io/shadshiny/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#7c3aed"

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]

articles:
  - title: Guides
    navbar: ~
    contents:
      - shadshiny
      - theming
      - overlays-and-server
      - migrating-inputs

