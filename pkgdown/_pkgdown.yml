url: https://orijitghosh.github.io/shadshiny/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#7c3aed"

navbar:
  structure:
    left: [intro, gallery, guides, reference, news]
    right: [search, github, lightswitch]
  components:
    gallery:
      text: Gallery
      href: articles/components.html
    guides:
      text: Guides
      menu:
        - text: Installation & setup
          href: articles/installation.html
        - text: Get started
          href: articles/shadshiny.html
        - text: Theming
          href: articles/theming.html
        - text: Forms & validation
          href: articles/forms.html
        - text: Data tables
          href: articles/data-tables.html
        - text: Dashboards & charts
          href: articles/charts.html
        - text: Streaming chat
          href: articles/chat.html
        - text: Structured chat workbench
          href: articles/chat-workbench.html
        - text: Questionnaire workflows
          href: articles/questionnaire.html
        - text: Layout & composition
          href: articles/layout.html
        - text: The server API
          href: articles/server-api.html
        - text: Overlays & the server
          href: articles/overlays-and-server.html
        - text: Migrating from base Shiny
          href: articles/migrating-inputs.html

articles:
  - title: Guides
    navbar: Guides
    contents:
      - installation
      - shadshiny
      - theming
      - forms
      - data-tables
      - charts
      - chat
      - chat-workbench
      - questionnaire
      - layout
      - server-api
      - overlays-and-server
      - migrating-inputs
  - title: Component gallery
    navbar: Gallery
    contents:
      - articles/components
      - articles/gallery-display
      - articles/gallery-inputs
      - articles/gallery-overlays
      - articles/gallery-navigation
      - articles/gallery-data
      - articles/gallery-chat
      - articles/icons

reference:
  - title: Page & theming
    desc: Page wrapper, theme presets, and runtime theme control.
    contents:
      - page_shad
      - shad_theme_preset
      - update_shad_theme
      - shad_run_example

  - title: Layout & page shells
    desc: Container, stack, and grid primitives, plus whole-page shells.
      Shadshiny additions, with no shadcn/ui counterpart.
    contents:
      - shad_container
      - shad_stack
      - shad_grid
      - shad_page_sidebar
      - shad_page_navbar

  - title: Tier 1 – display & typography
    desc: Non-interactive display components and typographic helpers.
    contents:
      - shad_button
      - shad_badge
      - shad_avatar
      - shad_avatar_group
      - shad_card
      - shad_card_header
      - shad_card_title
      - shad_card_description
      - shad_card_action
      - shad_card_content
      - shad_card_footer
      - shad_alert
      - shad_separator
      - shad_skeleton
      - shad_spinner
      - shad_aspect_ratio
      - shad_label
      - shad_progress
      - shad_breadcrumb
      - shad_breadcrumb_item
      - shad_breadcrumb_separator
      - shad_breadcrumb_ellipsis
      - shad_table
      - shad_table_header
      - shad_table_body
      - shad_table_footer
      - shad_table_row
      - shad_table_head
      - shad_table_cell
      - shad_table_caption
      - shad_kbd
      - shad_kbd_group
      - shad_code
      - shad_code_block
      - shad_scroll_fade
      - shad_shimmer
      - shad_h1
      - shad_h2
      - shad_h3
      - shad_h4
      - shad_p
      - shad_blockquote
      - shad_lead
      - shad_large
      - shad_small
      - shad_muted
      - shad_list
      - shad_item
      - shad_item_group
      - shad_item_separator
      - shad_empty
      - shad_button_group
      - shad_button_group_separator
      - shad_button_group_text

  - title: Tier 2 – form inputs
    desc: Bound Shiny inputs. Read with `input$id`; update with `update_shad_*()`.
      The field composition family (`shad_fieldset()` and its parts) is
      experimental.
    contents:
      - shad_input
      - shad_textarea
      - shad_checkbox
      - shad_switch
      - shad_radio_group
      - shad_radio_item
      - shad_toggle
      - shad_toggle_group
      - shad_toggle_group_item
      - shad_slider
      - shad_select
      - shad_select_item
      - shad_select_group
      - shad_select_separator
      - shad_native_select
      - shad_combobox
      - shad_input_otp
      - shad_calendar
      - shad_date_picker
      - shad_form_field
      - shad_fieldset
      - shad_field_group
      - shad_field_separator
      - shad_input_group
      - shad_input_group_addon
      - shad_input_group_text
      - shad_input_group_button

  - title: Chat & AI kit
    desc: Streaming transcript primitives – bubbles, messages, attachments,
      markers, and a stick-to-bottom scroller.
    contents:
      - shad_message
      - shad_message_group
      - shad_message_spinner
      - shad_bubble
      - shad_bubble_group
      - shad_attachment
      - shad_attachment_action
      - shad_attachment_group
      - shad_marker
      - shad_message_scroller
      - shad_message_scroller_item

  - title: Tier 3 – overlays
    desc: Dialogs, popovers, menus, command palette, and toasts (UI side).
    contents:
      - shad_dialog
      - shad_dialog_close
      - shad_dialog_close_button
      - shad_alert_dialog
      - shad_alert_dialog_close
      - shad_sheet
      - shad_sheet_close
      - shad_drawer
      - shad_drawer_close
      - shad_popover
      - shad_popover_close
      - shad_tooltip
      - shad_hover_card
      - shad_dropdown_menu
      - shad_context_menu
      - shad_menubar
      - shad_menubar_menu
      - shad_menu_item
      - shad_menu_checkbox_item
      - shad_menu_radio_group
      - shad_menu_radio_item
      - shad_menu_label
      - shad_menu_separator
      - shad_menu_sub
      - shad_command
      - shad_command_group
      - shad_command_item
      - shad_command_separator
      - shad_command_palette

  - title: Tier 3 – navigation & structure
    desc: Tabs, accordion, pagination, carousel, and the sidebar layout family.
    contents:
      - shad_tabs
      - shad_tab
      - shad_accordion
      - shad_accordion_item
      - shad_collapsible
      - shad_pagination
      - shad_scroll_area
      - shad_resizable
      - shad_resizable_panel
      - shad_resizable_handle
      - shad_carousel
      - shad_carousel_item
      - shad_navigation_menu
      - shad_navigation_menu_item
      - shad_sidebar_layout
      - shad_sidebar
      - shad_sidebar_group
      - shad_sidebar_item
      - shad_sidebar_trigger

  - title: Server – updates
    desc: Update bound component values from the server. Shiny-side API, so
      there is nothing in shadcn/ui to compare it against.
      `bind_shad_task_button()` is experimental.
    contents:
      - update_shad_input_otp
      - update_shad_checkbox
      - update_shad_switch
      - update_shad_radio_group
      - update_shad_toggle
      - update_shad_toggle_group
      - update_shad_slider
      - update_shad_select
      - update_shad_native_select
      - update_shad_combobox
      - update_shad_calendar
      - update_shad_date_picker
      - update_shad_tabs
      - update_shad_accordion
      - update_shad_pagination
      - update_shad_carousel
      - update_shad_sidebar
      - update_shad_progress
      - update_shad_button
      - bind_shad_task_button
      - update_shad_data_table
      - update_shad_stepper
      - update_shad_tree
      - update_shad_rating
      - update_shad_number_input
      - update_shad_form_field
      - update_shad_command

  - title: Server – overlays & toast
    desc: Open/close overlays and raise toast notifications from the server.
      Shiny-side API, so there is nothing in shadcn/ui to compare it against.
    contents:
      - shad_dialog_open
      - shad_alert_dialog_open
      - shad_sheet_open
      - shad_drawer_open
      - shad_popover_open
      - shad_show_dialog
      - shad_remove_dialog
      - shad_sidebar_toggle
      - shad_message_scroller_to_bottom
      - shad_toast
      - shad_toast_success
      - shad_toast_error
      - shad_toast_warning
      - shad_toast_loading
      - shad_toast_update
      - shad_toast_dismiss

  - title: Data table
    desc: A full-featured data table with sorting, filtering, paging, and
      selection, client-side or (experimental) lazily paged from the server.
    contents:
      - shad_data_table
      - shad_col
      - shad_fmt
      - update_shad_data_table
      - shad_data_table_server

  - title: Dashboard & charts
    desc: KPI cards, chart wrappers, timelines, and plot theming. Everything
      here except `shad_chart_container()` is a shadshiny addition. The
      ggplot2, plotly, and echarts4r adapters are experimental.
    contents:
      - shad_value_box
      - shad_sparkline
      - shad_mini_donut
      - shad_chart_container
      - shad_timeline
      - shad_timeline_item
      - shad_theme_ggplot2
      - shad_theme_plotly
      - shad_theme_echarts4r
      - shad_tokens
      - shad_chart_colors
      - shad_current_theme

  - title: Flow & input components
    desc: Stepper, tree, rating, number input, and file dropzone. Shadshiny
      additions, with no shadcn/ui counterpart.
    contents:
      - shad_stepper
      - shad_step
      - shad_tree
      - shad_tree_item
      - shad_rating
      - shad_number_input
      - shad_dropzone
      - shad_date_presets

  - title: Questionnaire
    desc: An experimental multi-step questionnaire of native fieldsets, with
      branching, skips, and bookmark restoration.
    contents:
      - shad_questionnaire
      - shad_question
      - update_shad_questionnaire

  - title: Forms & validation
    desc: A server-side validator with shadcn-styled field messaging. The
      shadcn/ui equivalent validates on the client; `shad_form_summary()` has no
      counterpart at all.
    contents:
      - shad_validator
      - shad_rules
      - shad_form_message
      - shad_form_counter
      - shad_form_summary

  - title: Custom theming
    desc: Build, import, and switch custom themes. Registry import is
      experimental.
    contents:
      - shad_theme
      - shad_theme_scope
      - shad_theme_from_registry

  - title: Chat
    desc: A streaming chat module built on the chat kit, and an experimental
      structured workbench for sources, tools, and attachments. Shadshiny
      additions, with no shadcn/ui counterpart.
    contents:
      - shad_chat_ui
      - shad_chat_server
      - shad_chat_workbench_ui
      - shad_chat_workbench_server

  - title: Utilities
    desc: Icons and the asset dependency.
    contents:
      - shad_icon
      - shad_icon_raw
      - shad_icon_names
      - shadshiny_deps
